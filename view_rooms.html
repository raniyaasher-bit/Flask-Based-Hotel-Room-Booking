<!DOCTYPE html>
<html>
<head>
    <title>View Rooms</title>
</head>
<body>

<!-- Navigation Links -->
<a href="/add_room">Add Room</a> |
<a href="/view_rooms">View Rooms</a> |
<a href="/add_booking">Add Booking</a> |
<a href="/view_bookings">View Bookings</a>
<hr>

<h1>All Rooms</h1>

{% if rooms %}
<table border="1" cellpadding="10">
    <tr>
        <th>Room Name</th>
        <th>Price</th>
    </tr>
    {% for room in rooms %}
    <tr>
        <td>{{ room.name }}</td>
        <td>₹{{ room.price }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No rooms available</p>
{% endif %}

</body>
</html>
